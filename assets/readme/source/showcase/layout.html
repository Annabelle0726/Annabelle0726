<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Portfolio README artwork</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff}body{font-family:Arial,sans-serif;color:#082d49}.scene{width:800px;overflow:hidden}.cover{height:230px;position:relative;background:#fcfaf3}.cover>img{position:absolute;width:800px;height:267px;left:0;top:-18px;object-fit:cover}.cover .copy{position:absolute;left:32px;top:46px;width:310px}.eyebrow{font-size:9px;letter-spacing:2.2px;color:#0055a4;margin:0 0 15px}.title{font-family:Georgia,serif;font-size:38px;line-height:1.12;font-weight:400;margin:0}.title span{font-size:43px}.subtitle{font-size:9px;letter-spacing:1.1px;margin-top:20px;color:#3e667c}.strip{height:196px;display:flex;gap:12px;padding:12px 12px 0;background:#f7f8fa;border:1px solid #e8edf0;border-radius:6px}.tile{width:calc((100% - 24px)/3);min-width:0}.frame{height:145px;background:#fff;border:1px solid #e2e6e9;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}.frame img{display:block;width:100%;height:100%;object-fit:contain}.label{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;white-space:nowrap}.num{font-size:9px;color:#9b7427}.pages .frame img{object-fit:cover;object-position:top}.pages{height:196px}.pages .label{font-size:12px}
.tile:first-child .frame img[src*="ux-cupcakes"]{object-fit:cover;object-position:top}.pages .tile:first-child .frame img{object-fit:contain;object-position:center}.pages .tile:nth-child(2) .frame img{object-fit:cover;object-position:top}</style>
<div id="scene" class="scene"></div>
<script>
const sets={fullstack:[['fullstack-bloom','Agency Bloom'],['fullstack-belay','Belay'],['fullstack-somnia','Somnia Library']],ux:[['ux-cupcakes','Cupcakes'],['ux-reverie','Reverie Reads'],['ux-travel','Travel Discovery']],ai:[['ai-waymark','Waymark'],['ai-taste','Taste Studio'],['ai-atelier','README Atelier']],data:[['data-athub','AtHub'],['data-visualization','Public data'],['data-energy','Data-center siting']],pages:[['page-about','About'],['page-writing','Writing'],['page-contact','Contact']]};
const key=new URLSearchParams(location.search).get('scene')||'cover';
document.querySelector('#scene').innerHTML=key==='cover'?'<div class="cover"><img src="cover-art.png" alt="Conceptual blue glass browser frames, a flowing ribbon and paper pages"><div class="copy"><p class="eyebrow">A PERSONAL WEBSITE</p><h1 class="title">Annabelle’s<br><span>Portfolio</span></h1><p class="subtitle">PROJECTS · WRITING · DISCOVERIES</p></div></div>':`<div class="strip ${key==='pages'?'pages':''}">${sets[key].map(([file,name],i)=>`<div class="tile"><div class="frame"><img src="${file}.png" alt="${name} page preview"></div><div class="label"><span class="num">0${i+1}</span>${name}</div></div>`).join('')}</div>`;
</script></html>
