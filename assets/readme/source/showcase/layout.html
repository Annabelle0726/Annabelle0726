<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Portfolio README artwork</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff}body{font-family:Arial,sans-serif;color:#082d49}.scene{width:800px;overflow:hidden}.cover{height:230px;position:relative;background:#fcfaf3}.cover>img{position:absolute;width:800px;height:267px;left:0;top:-18px;object-fit:cover}.cover .copy{position:absolute;left:32px;top:46px;width:310px}.eyebrow{font-size:9px;letter-spacing:2.2px;color:#0055a4;margin:0 0 15px}.title{font-family:Georgia,serif;font-size:38px;line-height:1.12;font-weight:400;margin:0}.title span{font-size:43px}.subtitle{font-size:9px;letter-spacing:1.1px;margin-top:20px;color:#3e667c}.strip{height:196px;display:flex;gap:12px;padding:12px 12px 0;background:#f7f8fa;border:1px solid #e8edf0;border-radius:6px}.tile{width:calc((100% - 24px)/3);min-width:0}.frame{height:145px;background:#fff;border:1px solid #e2e6e9;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center}.frame img{display:block;width:100%;height:100%;object-fit:contain}.label{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;white-space:nowrap}.num{font-size:9px;color:#9b7427}.pages .frame img{object-fit:cover;object-position:top}.pages{height:196px}.pages .label{font-size:12px}
.tile:first-child .frame img[src*="ux-cupcakes"]{object-fit:cover;object-position:top}.pages .tile:first-child .frame img{object-fit:contain;object-position:center}.pages .tile:nth-child(2) .frame img{object-fit:cover;object-position:top}

.frame{position:relative;border:1px solid #e0e7e9;background:#f2eee5;box-shadow:0 2px 5px #082d490a}.frame img{object-fit:cover}
.frame img[src*="fullstack-bloom"]{object-position:center 35%}
.frame img[src*="fullstack-belay"]{height:195px;object-fit:cover;object-position:top;position:absolute;top:0}
.frame img[src*="fullstack-somnia"]{object-position:center 42%}
.frame img[src*="ux-reverie"]{object-position:center 70%}
.frame img[src*="ux-travel"]{object-position:center 44%}
.frame img[src*="ai-taste"]{object-position:center 52%}
.frame img[src*="ai-waymark"]{object-position:center 35%}
.frame img[src*="page-writing"]{object-position:center 58%;height:177px;max-width:none}
.portrait-card{display:flex;height:100%;width:100%;background:#eee8dd;align-items:center;padding-left:13px;gap:4px}.portrait-card div{width:44%;font:19px/1.15 Georgia;color:#082d49}.portrait-card small{display:block;font:8px/1.7 Arial;margin-top:12px;color:#63716d}.pages .tile:first-child .portrait-card img{width:56%;height:100%;object-fit:cover;object-position:center 18%}
.chart-card{height:100%;width:100%;padding:7px;background:#eaf1f4}.chart-card.warm{background:#f4ede4}.chart-card small{display:block;font-size:8px;letter-spacing:.8px;color:#356079;margin-bottom:4px}.chart-card img{width:100%;height:118px;object-fit:contain;background:white;border-radius:3px;box-shadow:0 2px 5px #18374612}
.frame img[src*="success.webp"]{object-fit:cover;object-position:top}.frame img[src*="article-page-soul"]{object-fit:cover;object-position:center}.frame img[src*="data-energy"]{object-fit:fill}.contact-card{height:100%;width:100%;position:relative;background:#fff9e4;overflow:hidden}.contact-art{position:absolute;right:0;top:0;width:65%;height:118px;background:url(page-contact.png) right -3px top -20px/auto 205px no-repeat}.contact-copy{position:absolute;left:13px;top:29px;color:#082d49;font:20px/1.15 Georgia}.contact-copy small{display:block;font:8px/1.5 Arial;color:#0055a4;margin-top:16px;letter-spacing:1px}.strip.ai-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));height:464px;gap:14px;padding:12px}.ai-grid .tile{width:auto}.ai-grid .frame{height:190px}.ai-grid .label{font-size:13px;margin-top:7px}.ai-grid .frame img{object-fit:cover;object-position:center}.ai-grid .frame img[src*="article-spec"]{object-fit:cover}</style>
<div id="scene" class="scene"></div>
<script>
const sets={fullstack:[['fullstack-bloom','Agency Bloom'],['fullstack-belay','Belay'],['fullstack-somnia','Somnia Library']],ux:[['ux-cupcakes','Cupcakes'],['ux-reverie','Reverie Reads'],['ux-travel','Travel Discovery']],ai:[['ai-waymark','Waymark'],['ai-taste','Taste Studio'],['ai-atelier','README Atelier'],['ai-spec','Spec to Tested Code']],data:[['data-athub','AtHub'],['data-visualization','Public data'],['data-energy','Data-center siting']],pages:[['page-about','About'],['page-writing','Writing'],['page-contact','Contact']]};
const key=new URLSearchParams(location.search).get('scene')||'cover';
document.querySelector('#scene').innerHTML=key==='cover'?'<div class="cover"><img src="cover-art.png" alt="Conceptual blue glass browser frames, a flowing ribbon and paper pages"><div class="copy"><p class="eyebrow">A PERSONAL WEBSITE</p><h1 class="title">Annabelle’s<br><span>Portfolio</span></h1><p class="subtitle">PROJECTS · WRITING · DISCOVERIES</p></div></div>':`<div class="strip ${key==='pages'?'pages':key==='ai'?'ai-grid':''}">${sets[key].map(([file,name],i)=>`<div class="tile"><div class="frame">${key==='pages'&&i===2?`<div class="contact-card"><div class="contact-art"></div><div class="contact-copy">Let's<br>connect.<small>CONTACT ↗</small></div></div>`:key==='data'&&i<2?`<div class="chart-card ${i===1?'warm':''}"><small>${i===0?'MODEL COMPARISON':'PUBLIC DATA / RELATIONSHIPS'}</small><img src="../../../../src/assets/data-projects/${i===0?'athub-4.png':'viz-3.png'}" alt="Original analysis figure"></div>`:key==='pages'&&i===0?`<div class="portrait-card"><div>About<br>Annabelle<small>CURIOSITY<br>WRITING<br>DISCOVERY</small></div><img src="page-about.png" alt="Annabelle portrait"></div>`:`<img src="${file==='ai-spec'?'../../../../src/assets/article-spec-to-tested-code/0.webp':file==='page-writing'?'../../../../src/assets/article-page-soul/0.webp':file==='fullstack-belay'?'../../../../src/assets/belay-case/success.webp':file+'.png'}" alt="${name} page preview">`}</div><div class="label"><span class="num">0${i+1}</span>${name}</div></div>`).join('')}</div>`;
</script></html>
