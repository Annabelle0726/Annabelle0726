<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio · 页面导览</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fa}#scene{width:100%;background:#f3f7fa;color:#082d49;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;padding:24px}.heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;gap:18px}h1{font:32px Georgia,serif;margin:0;color:#0055a4}.steps{font-size:13px;color:#476c83}.screen{position:relative;aspect-ratio:1280/900;border:1px solid #b7d1df;background:#fffdf0;overflow:hidden}.screen picture{position:absolute;inset:0}.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.caption{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}.caption strong{font-size:20px;font-weight:500}.caption span{font-size:13px;color:#476c83}footer{border-top:1px solid #d4a43a;margin-top:16px;padding-top:12px;font-size:11px;color:#476c83}@media(max-width:600px){.screen{aspect-ratio:390/844}#scene{padding:14px}h1{font-size:26px}.heading{display:block}.steps{margin-top:10px}.caption{display:block}.caption strong,.caption span{display:block}.caption span{margin-top:7px}}</style>
<div id="scene"><div class="heading"><h1>A closer look.</h1><div class="steps" id="steps">作品索引 / 项目细节 / 界面设计</div></div><div class="screen"><picture><source media="(max-width: 600px)" srcset="projects-mobile.png"><img src="projects.png" alt="作品集实际页面：全栈项目索引"></picture><picture><source media="(max-width: 600px)" srcset="project-detail-mobile.png"><img src="project-detail.png" alt="作品集实际页面：Agency Bloom 项目介绍"></picture><picture><source media="(max-width: 600px)" srcset="design-mobile.png"><img src="design.png" alt="作品集实际页面：UX/UI 设计"></picture></div><div class="caption"><strong id="caption"></strong><span id="detail"></span></div><footer id="note">真实页面截图编排的导览 · 非连续操作录屏</footer></div>
<script>
const en=new URLSearchParams(location.search).get('lang')==='en';
const labels=en?['01 / Browse the work','02 / Open a project','03 / Explore interface studies']:['01 / 从作品索引开始','02 / 打开一个项目','03 / 看界面与交互'];
const descriptions=en?['Full-stack projects and their context','Role, product, process and demo','Selected interface studies and contributions']:['先了解项目与它解决的问题','看角色、产品、设计过程与演示','继续探索界面案例与参与范围'];
if(en){document.getElementById('steps').textContent='Projects / Project detail / Interface studies';document.getElementById('note').textContent='A tour composed from real page screenshots, not a continuous screen recording.';}
const images=[...document.querySelectorAll('.screen picture')];
window.readmeAtelier={ready:false,duration:12,renderAt(seconds){const t=Math.max(0,Math.min(11.9999,seconds)),stage=Math.floor(t/4),phase=t%4,fade=Math.max(0,Math.min(1,(phase-3.5)/.5));images.forEach((img,i)=>img.style.opacity=i===stage?1-fade:i===(stage+1)%3?fade:0);document.getElementById('caption').textContent=labels[stage];document.getElementById('detail').textContent=descriptions[stage];}};
Promise.all([document.fonts.ready,...[...document.querySelectorAll('.screen img')].map(i=>i.decode())]).then(()=>{window.readmeAtelier.renderAt(0);window.readmeAtelier.ready=true});
</script></html>
